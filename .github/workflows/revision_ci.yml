name: Analytics revision checks
on:
  push:
    branches: ["revision/**"]
  pull_request:
    paths: ["backend/**", "Monitoring, Dashboard, and Control/WaterMonitor/**", ".github/workflows/revision_ci.yml"]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backend/functions/index.js
      - run: npm test --prefix backend/functions
  firebase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
        working-directory: backend/functions
      - name: Check Firebase handlers and access rules against emulators
        working-directory: backend
        run: functions/node_modules/.bin/firebase emulators:exec --project demo-hydrosense --config emulators.json --only firestore,database 'npm run test:integration --prefix functions'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-integration-logs
          path: |
            backend/*debug.log
            backend/functions/package-lock.json
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate backend model fixture for Kotlin parity check
        run: |
          mkdir -p 'Monitoring, Dashboard, and Control/WaterMonitor/app/src/test/resources'
          node -e "process.stdout.write(JSON.stringify(require('./backend/functions/model').baseline))" > 'Monitoring, Dashboard, and Control/WaterMonitor/app/src/test/resources/monthly-prior-fixture.json'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        working-directory: "Monitoring, Dashboard, and Control/WaterMonitor/app"
        run: echo "$KEYSTORE_B64" | base64 --decode > keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Test and assemble debug APK
        working-directory: "Monitoring, Dashboard, and Control/WaterMonitor"
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
        env:
          SIGNING_STORE_FILE: keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-debug-and-reports
          path: |
            Monitoring, Dashboard, and Control/WaterMonitor/app/build/outputs/apk/debug/*.apk
            Monitoring, Dashboard, and Control/WaterMonitor/app/build/outputs/apk/release/*.apk
            Monitoring, Dashboard, and Control/WaterMonitor/app/build/reports/tests/
